<html lang="en">

  <meta name="theme-color" content="#0b1020" />
  <meta name="description" content="Equation Escape is a timed mathematics escape game with strategic routes, lifelines, and time boosts." />
  <title>Equation Escape — Outsmart the Equations</title>
  <style>

    .btn { display:inline-flex; justify-content:center; align-items:center; gap:9px; min-height:46px; padding:12px 18px; border:1px solid transparent; border-radius:13px; color:#08121d; background:var(--cyan); font-weight:850; cursor:pointer; transition:transform .16s ease,filter .16s ease,border-color .16s ease,background .16s ease; }

    .chamber-step.current { border-color:rgba(99,230,226,.45); background:rgba(99,230,226,.065); box-shadow:inset 0 0 0 1px rgba(99,230,226,.05); }.chamber-step.current .step-number { background:var(--cyan); color:#07141b; }

    .game-topline { display:flex; justify-content:space-between; gap:12px; align-items:center; margin-bottom:13px; }
    .level-label { color:var(--muted); font-size:12px; font-weight:750; }.route-chip { padding:7px 10px; border:1px solid rgba(99,230,226,.25); border-radius:999px; color:var(--cyan); font-size:10px; font-weight:850; letter-spacing:.09em; text-transform:uppercase; background:rgba(99,230,226,.06); }

    .inventory-row { display:flex; justify-content:space-between; gap:12px; margin-top:13px; font-size:12px; }.inventory-row strong { font-variant-numeric:tabular-nums; }

<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand" aria-label="Equation Escape home">
        <div class="brand-mark" aria-hidden="true">∑</div>
        <div><div class="brand-name">EQUATION ESCAPE</div><div class="brand-sub">A strategic math challenge</div></div>
      </div>
      <div class="top-pill"><span class="dot" aria-hidden="true"></span> Browser game · Autosave checkpoints</div>
    </header>
    <main id="app" aria-live="polite"></main>
    <footer class="footer"><span>Made for curious minds · HTML, CSS & JavaScript</span><span>Think clearly. Choose wisely. Escape.</span></footer>
  </div>

  <script>
  (() => {
    'use strict';

    // ------------------------- Game configuration -------------------------
    const STORAGE_KEY = 'equationEscapeCheckpointV1';
    const LEVELS = [
      { name: 'Entry Chamber', difficulty: 'Warm-up', algebra: 'Expressions and one-step equations', statistics: 'Mean, median, mode and small data sets' },
      { name: 'Logic Chamber', difficulty: 'Steady', algebra: 'Two-step equations and integer operations', statistics: 'Tables, percentages and basic probability' },
      { name: 'Challenge Chamber', difficulty: 'Focused', algebra: 'Distributive property and variables on both sides', statistics: 'Range, comparisons and sample-space probability' },
      { name: 'Advanced Chamber', difficulty: 'Advanced', algebra: 'Multi-step equations with fractions or decimals', statistics: 'Quartiles, IQR, changing means and independent events' },
      { name: 'Final Chamber', difficulty: 'Expert', algebra: 'Complex equations, formulas and word problems', statistics: 'Weighted means, combined data and multi-step reasoning' }
    ];
    const ROUTES = {
      algebra: { name: 'Algebra Door', short: 'Algebra', description: 'Follow the unknown. Untangle equations and find the value that unlocks the chamber.', reward: '1 Time Boost', icon: 'x²', className: 'algebra' },
      statistics: { name: 'Statistics Door', short: 'Statistics', description: 'Read the data, spot the pattern, and turn evidence into the right answer.', reward: '1 Lifeline', icon: '∑', className: 'stats' },
      mixed: { name: 'Mixed Door', short: 'Mixed', description: 'Switch your thinking between algebra and statistics every question.', reward: 'Choose 1 Lifeline or Time Boost', icon: '⇄', className: 'mixed' }
    };
    const MAX_RESOURCE = 2;
    const MAX_SCORE = 50;
    const MAX_QUESTION_SECONDS = 40;

    const state = {
      screen: 'start',
      completedLevels: 0,
      currentLevel: 0,
      selectedRoute: null,
      questionIndex: 0,
      questions: [],
      savedScore: 0,
      currentScore: 0,

    // ------------------------- General helpers ----------------------------

    function makeQuestion(prompt, answer, distractors, subject, topic) {

    // ------------------------- Algebra question generator -----------------
    function algebraQuestion(level) {
      let prompt, answer, wrong, a, b, c, d, x, coefficient;
      if (level === 0) {
        const type = rand(0, 3);
        x = rand(-8, 18);
        if (type === 0) {

          prompt = `Solve for x:  x + ${a} = ${b}`; answer = x; wrong = [b + a, b - a, x + 1];

        } else if (type === 2) {
          a = rand(2, 9); b = a * x;
          prompt = `Solve for x:  ${a}x = ${b}`; answer = x; wrong = [b + a, x + a, x - 2];
        } else {
          a = rand(2, 9); b = rand(-5, 10);

      if (level === 1) {
        if (rand(0, 1) === 0) {
          a = rand(2, 7); x = rand(-8, 15); b = rand(-9, 12); c = a * x + b;
          prompt = `Solve for x:  ${a}x${signedTerm(b)} = ${c}`; answer = x; wrong = [x + 1, x - 1, Math.round((c - b) / a) + 2];
        } else {
          a = rand(2, 6); x = rand(-8, 14); c = rand(-5, 8); b = a * c - x;
          prompt = `Solve for x:  (x ${b < 0 ? `− ${Math.abs(b)}` : `+ ${b}`}) ÷ ${a} = ${c}`; answer = x; wrong = [a * c + b, x + a, x - 2];

      }

        x = rand(-8, 13); b = rand(-6, 9); d = a * (x + b) - c * x;
        if (rand(0, 1) === 0) {
          prompt = `Solve for x:  ${a}(x ${b < 0 ? `− ${Math.abs(b)}` : `+ ${b}`}) = ${c}x${signedTerm(d)}`;
          wrong = [x + 1, x - 1, Math.round((d + b) / (a - c))];
        } else {
          const left = a * x + b; d = left - c * x;
          prompt = `Solve for x:  ${a}x${signedTerm(b)} = ${c}x${signedTerm(d)}`;
          wrong = [x + 1, x - 2, -x];
        }
        return makeQuestion(prompt, x, wrong, 'Algebra', 'Variables on both sides');
      }
      if (level === 3) {
        if (rand(0, 1) === 0) {
          a = rand(2, 7); c = rand(2, 6); x = rand(-8, 12); d = rand(-5, 12); b = c * d - a * x;
          prompt = `Solve for x:  (${a}x${signedTerm(b)}) ÷ ${c} = ${d}`;
          answer = x; wrong = [x + 1, x - 1, x + 3];
        } else {
          coefficient = pick([0.5, 1.5, 2.5]); x = rand(-8, 12); b = rand(-8, 12); c = coefficient * x + b;

    }

    // ------------------------- Statistics question generator --------------
    function statisticsQuestion(level) {
      let data, answer, wrong, prompt, total, favorable, mean, newScore, n, a, b, q1, q3;
      if (level === 0) {
        const type = rand(0, 2);

        }

          prompt = `For the sorted data set ${data.join(', ')}, find the interquartile range (IQR). Use the median of each half.`;

          wrong = [fmt((mean + newScore) / 2), fmt(mean + newScore / n), fmt((n * mean) / (n + 1))];

        }

        wrong = ['1/6', '1/8', '1/4'];

      }

        wrong = [fmt((m1 + m2) / 2), fmt((n1 * m1 + m2) / 2), fmt((m1 + n2 * m2) / (n1 + n2))];

        n = rand(4, 8); mean = rand(10, 25); const knownSum = n * mean - rand(3, 18); answer = fmt(n * mean - knownSum);

    // A rule-based safety bank is used if repeated random generation ever fails.
    // Seeded values keep backup questions level-appropriate and help avoid repeats.
    function fallbackQuestion(level, subject, seed) {

        else if (level === 1) { a = 2 + (seed % 5); x = (seed % 17) - 5; b = (seed % 9) - 4; prompt = `Solve for x: ${a}x${signedTerm(b)} = ${a * x + b}`; answer = x; }

      }

    function generateOneQuestion(level, subject, used, blocked) {
      for (let attempt = 0; attempt < 250; attempt++) {
        const question = subject === 'Algebra' ? algebraQuestion(level) : statisticsQuestion(level);
        if (validQuestion(question) && !used.has(question.signature) && !blocked.has(question.signature)) {
          used.add(question.signature);
          return question;
        }
      }
      for (let seed = 1; seed <= 800; seed++) {
        const question = fallbackQuestion(level, subject, seed);
        if (validQuestion(question) && !used.has(question.signature) && !blocked.has(question.signature)) {
          used.add(question.signature);
          return question;
        }

      let suffix = 1;

        question.prompt += ` [variant ${suffix}]`;
        question.signature = `${question.prompt}||${question.answer}`;
        if (validQuestion(question) && !used.has(question.signature) && !blocked.has(question.signature)) {

        const subject = route === 'mixed' ? (index % 2 === 0 ? 'Algebra' : 'Statistics') : (route === 'algebra' ? 'Algebra' : 'Statistics');
        questions.push(generateOneQuestion(level, subject, used, blocked));
      }
      return questions;
    }

    // ------------------------- Storage and progression --------------------
    function loadCheckpoint() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (!data || data.version !== 1) return;
        state.completedLevels = Math.max(0, Math.min(5, Number(data.completedLevels) || 0));
        state.currentLevel = state.completedLevels;
        state.savedScore = Math.max(0, Math.min(MAX_SCORE, Number(data.savedScore) || 0));
        state.lifelines = Math.max(0, Math.min(MAX_RESOURCE, Number(data.lifelines) || 0));
        state.timeBoosts = Math.max(0, Math.min(MAX_RESOURCE, Number(data.timeBoosts) || 0));
        state.streak = Math.max(0, Number(data.streak) || 0);
        state.lastAttemptByLevel = data.lastAttemptByLevel && typeof data.lastAttemptByLevel === 'object' ? data.lastAttemptByLevel : {};
        state.retryRoute = ROUTES[data.retryRoute] ? data.retryRoute : null;
        state.retryLevel = Number.isInteger(data.retryLevel) ? data.retryLevel : null;
        state.pendingFinishedLevel = Number.isInteger(data.pendingFinishedLevel) ? data.pendingFinishedLevel : null;
        state.pendingRoute = data.pendingRoute === 'mixed' ? 'mixed' : null;
        state.lastCompletion = data.lastCompletion && typeof data.lastCompletion === 'object' ? data.lastCompletion : null;

        console.warn('Could not restore Equation Escape progress:', error);
      }
    }
    function saveCheckpoint() {
      const snapshot = {
        version: 1,
        completedLevels: state.completedLevels,
        savedScore: state.savedScore,
        lifelines: state.lifelines,
        timeBoosts: state.timeBoosts,
        streak: state.streak,
        lastAttemptByLevel: state.lastAttemptByLevel,
        retryRoute: state.retryRoute,
        retryLevel: state.retryLevel,
        pendingFinishedLevel: state.pendingFinishedLevel,
        pendingRoute: state.pendingRoute,
        lastCompletion: state.lastCompletion,
        savedAt: Date.now()
      };
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
        state.hasSavedRun = true;
      } catch (error) {

        console.warn('Progress could not be saved in this browser:', error);
      }
    }
    function resetGame(clearStorage = true) {
      stopTimer();

      state.completedLevels = 0;
      state.currentLevel = 0;
      state.selectedRoute = null;
      state.questionIndex = 0;
      state.questions = [];
      state.savedScore = 0;
      state.currentScore = 0;
      state.lifelines = 0;
      state.timeBoosts = 0;
      state.streak = 0;
      state.lastAttemptByLevel = {};
      state.attemptNumber = 0;
      state.failure = null;
      state.feedback = '';

      state.boostUsedThisQuestion = false;
      state.lifelineUsedThisQuestion = false;

      state.retryLevel = null;
      state.pendingFinishedLevel = null;
      state.pendingRoute = null;
      state.lastCompletion = null;
      state.hasSavedRun = false;

    function continueJourney() {
      if (state.completedLevels >= 5) { state.screen = 'victory'; render(); return; }

      if (state.retryRoute && state.retryLevel === state.completedLevels) { startLevel(state.retryRoute); return; }
      state.currentLevel = state.completedLevels;
      state.screen = 'route';
      render();
    }

    // ------------------------- Timer --------------------------------------
    function stopTimer() {
      if (timerInterval !== null) clearInterval(timerInterval);

      timerToken++;
    }
    function startTimer() {
      stopTimer();
      const token = timerToken;
      state.timerStartedAt = Date.now();

      state.timerDeadline = state.timerStartedAt + state.totalAllowedMs;
      state.boostUsedThisQuestion = false;
      lastTickShown = null;
      updateTimerDisplay();
      timerInterval = setInterval(() => {
        if (token !== timerToken || state.screen !== 'game' || state.questionLocked) return;
        const remaining = state.timerDeadline - Date.now();
        if (remaining <= 0) {
          updateTimerDisplay(0);
          failLevel('timeout');
          return;
        }
        updateTimerDisplay(remaining);
      }, 100);
    }
    function updateTimerDisplay(remainingOverride) {
      const remaining = remainingOverride !== undefined ? remainingOverride : Math.max(0, state.timerDeadline - Date.now());
      const seconds = Math.max(0, Math.ceil(remaining / 1000));
      const label = document.getElementById('timer-value');
      const fill = document.getElementById('timer-fill');
      const track = document.getElementById('timer-track');
      if (label) {
        label.textContent = `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
        label.classList.toggle('urgent', seconds <= 7);
      }
      if (fill) fill.style.width = `${Math.max(0, Math.min(100, remaining / state.totalAllowedMs * 100))}%`;
      if (track) track.setAttribute('aria-valuenow', String(seconds));
      lastTickShown = seconds;
    }

    // ------------------------- Gameplay actions ---------------------------
    function startLevel(route) {
      if (state.completedLevels >= 5 || !ROUTES[route]) return;
      stopTimer();
      state.currentLevel = state.completedLevels;
      state.selectedRoute = route;
      state.retryRoute = route;
      state.retryLevel = state.currentLevel;
      state.questionIndex = 0;
      state.currentScore = 0;
      state.lifelineUsedThisQuestion = false;
      state.eliminatedChoices = [];
      state.boostUsedThisQuestion = false;
      state.questions = generateAttemptQuestions(state.currentLevel, route);
      state.attemptNumber++;
      state.failure = null;
      state.feedback = '';
      state.questionLocked = false;
      state.screen = 'game';
      render();
    }
    function useLifeline() {
      if (state.screen !== 'game' || state.questionLocked || state.lifelines <= 0 || state.lifelineUsedThisQuestion) return;
      if (Date.now() >= state.timerDeadline) { failLevel('timeout'); return; }
      const question = state.questions[state.questionIndex];
      const wrongChoices = question.choices.filter(choice => !sameValue(choice, question.answer));
      if (!wrongChoices.length) return;
      const eliminated = pick(wrongChoices);
      state.lifelines--;
      state.lifelineUsedThisQuestion = true;
      state.eliminatedChoices = [eliminated];
      state.feedback = `Lifeline used: one incorrect option removed.`;
      renderGame(false);
      updateTimerDisplay();
      // The active timer is intentionally left running.
    }
    function useTimeBoost() {
      if (state.screen !== 'game' || state.questionLocked || state.timeBoosts <= 0 || state.boostUsedThisQuestion) return;
      const now = Date.now();
      if (now >= state.timerDeadline) { failLevel('timeout'); return; }
      const ceiling = state.timerStartedAt + MAX_QUESTION_SECONDS * 1000;
      const nextDeadline = Math.min(state.timerDeadline + 10000, ceiling);
      if (nextDeadline <= state.timerDeadline) return;
      state.timerDeadline = nextDeadline;
      state.totalAllowedMs = state.timerDeadline - state.timerStartedAt;
      state.timeBoosts--;
      state.boostUsedThisQuestion = true;
      state.feedback = 'Time Boost activated: 10 seconds added (maximum 40 seconds total).';
      const feedback = document.getElementById('feedback');
      if (feedback) feedback.textContent = state.feedback;
      const boostButton = document.getElementById('boost-btn');
      if (boostButton) { boostButton.disabled = true; boostButton.innerHTML = `◷ Time Boost <span class="resource-count">${state.timeBoosts}</span>`; }
      updateTimerDisplay();
    }
    function answerQuestion(choice) {
      if (state.screen !== 'game' || state.questionLocked) return;
      if (Date.now() >= state.timerDeadline) { failLevel('timeout'); return; }
      const question = state.questions[state.questionIndex];
      if (sameValue(choice, question.answer)) {
        state.questionLocked = true;
        stopTimer();
        state.currentScore++;
        state.streak++;
        let rewardMessage = '';
        if (state.streak > 0 && state.streak % 5 === 0) {
          if (state.lifelines < MAX_RESOURCE) {
            state.lifelines++;
            rewardMessage = ' Streak reward: +1 Lifeline!';
          } else {
            rewardMessage = ' Streak reward reached, but your Lifeline inventory is full.';
          }
        }
        state.feedback = `Correct! +1 point.${rewardMessage}`;
        if (state.questionIndex === 9) {
          completeLevel();
          return;
        }
        state.questionIndex++;
        state.questionLocked = false;
        state.lifelineUsedThisQuestion = false;
        state.eliminatedChoices = [];
        state.boostUsedThisQuestion = false;
        render();
      } else {
        failLevel('wrong');
      }
    }
    function failLevel(reason) {
      if (state.screen !== 'game' || state.questionLocked) return;
      state.questionLocked = true;
      stopTimer();
      state.streak = 0;
      state.failure = {
        reason,
        level: state.currentLevel,
        route: state.selectedRoute,
        questionNumber: state.questionIndex + 1,
        attemptScore: state.currentScore
      };
      state.retryRoute = state.selectedRoute;
      state.retryLevel = state.currentLevel;
      state.lastAttemptByLevel[String(state.currentLevel)] = state.questions.map(question => question.signature);
      state.screen = 'fail';
      saveCheckpoint();
      render();
    }
    function restartLevel() {
      if (state.screen !== 'fail') return;
      stopTimer();
      state.currentLevel = state.failure ? state.failure.level : state.completedLevels;
      state.selectedRoute = state.failure ? state.failure.route : state.selectedRoute;
      state.questionIndex = 0;
      state.currentScore = 0;
      state.questions = generateAttemptQuestions(state.currentLevel, state.selectedRoute);
      state.attemptNumber++;
      state.lifelineUsedThisQuestion = false;
      state.eliminatedChoices = [];
      state.failure = null;
      state.feedback = '';
      state.questionLocked = false;
      state.boostUsedThisQuestion = false;
      state.screen = 'game';
      // Inventory is preserved; resources already used stay spent. The streak was reset on failure.
      saveCheckpoint();
      render();
    }
    function awardResource(type) {
      if (type === 'lifeline') {
        if (state.lifelines < MAX_RESOURCE) state.lifelines++;
      } else if (type === 'boost') {
        if (state.timeBoosts < MAX_RESOURCE) state.timeBoosts++;
      }
    }
    function completeLevel() {
      stopTimer();
      const finishedLevel = state.currentLevel;
      const finishedRoute = state.selectedRoute;
      state.savedScore = Math.min(MAX_SCORE, state.savedScore + state.currentScore);
      state.completedLevels = Math.max(state.completedLevels, finishedLevel + 1);
      state.currentScore = 0;
      state.currentLevel = state.completedLevels;
      state.selectedRoute = null;
      state.retryRoute = null;
      state.retryLevel = null;
      state.questionIndex = 0;
      state.questions = [];
      state.questionLocked = false;
      let rewardText = '';
      if (finishedRoute === 'algebra') {
        const before = state.timeBoosts; awardResource('boost');
        rewardText = state.timeBoosts > before ? 'Time Boost added.' : 'Time Boost inventory full; reward lost.';
      } else if (finishedRoute === 'statistics') {
        const before = state.lifelines; awardResource('lifeline');
        rewardText = state.lifelines > before ? 'Lifeline added.' : 'Lifeline inventory full; reward lost.';
      } else {
        state.lastRewardChoices = ['lifeline', 'boost'];
        state.pendingRewardText = 'Choose a reward for completing the Mixed Door.';
        state.pendingFinishedLevel = finishedLevel;
        state.screen = 'mixed-reward';
        state.pendingRoute = finishedRoute;
        saveCheckpoint();
        render();
        return;
      }
      state.lastCompletion = { level: finishedLevel, route: finishedRoute, rewardText };
      if (state.completedLevels >= 5) state.screen = 'victory';
      else state.screen = 'route';
      saveCheckpoint();
      render();
    }
    function chooseMixedReward(type) {
      if (state.screen !== 'mixed-reward') return;
      const allowed = type === 'lifeline' ? state.lifelines < MAX_RESOURCE : state.timeBoosts < MAX_RESOURCE;
      if (!allowed) return;
      awardResource(type);
      state.lastCompletion = { level: state.pendingFinishedLevel, route: 'mixed', rewardText: `${type === 'lifeline' ? 'Lifeline' : 'Time Boost'} added.` };
      state.pendingRewardText = '';
      state.pendingFinishedLevel = null;
      state.pendingRoute = null;
      state.screen = state.completedLevels >= 5 ? 'victory' : 'route';
      saveCheckpoint();
      render();
    }

    // ------------------------- Rendering ----------------------------------
    function render() {
      stopTimer();
      if (state.screen === 'start') return renderStart();
      if (state.screen === 'route') return renderRoutes();
      if (state.screen === 'game') return renderGame(true);
      if (state.screen === 'fail') return renderFail();
      if (state.screen === 'mixed-reward') return renderMixedReward();
      if (state.screen === 'victory') return renderVictory();
      renderStart();
    }
    function renderStart() {
      const hasProgress = state.hasSavedRun;
      app.innerHTML = `
        <section class="panel hero" aria-labelledby="hero-title">
          <div class="hero-copy">
            <div class="eyebrow">Your next great escape</div>
            <h1 id="hero-title">Equation <span>Escape</span></h1>
            <p class="tagline">Challenge your mind. Outsmart the equations. Race against time.</p>
            <p class="hero-lead">Five chambers stand between you and freedom. Choose your route, solve ten timed challenges, and manage Lifelines and Time Boosts to keep your run alive.</p>
            <div class="hero-actions">
              ${hasProgress ? '<button class="btn" id="continue-btn">Continue Journey <span aria-hidden="true">→</span></button><button class="btn secondary" id="new-game-btn">Start New Game</button>' : '<button class="btn" id="play-btn">Enter the Escape <span aria-hidden="true">→</span></button>'}
            </div>
          </div>
          <div class="hero-art" aria-hidden="true">
            <div class="orbit"></div><div class="float-symbol sym-one">÷</div><div class="float-symbol sym-two">π</div><div class="float-symbol sym-three">∑</div>
            <div class="core-card"><div class="core-equation">x + 7 = ?</div><div class="core-caption">Every answer opens a door</div></div>
          </div>
        </section>
        <div class="feature-row">
          <div class="feature"><div class="feature-icon">5×</div><div><strong>Five chambers</strong><span>50 questions with rising difficulty.</span></div></div>
          <div class="feature"><div class="feature-icon">◷</div><div><strong>Beat the clock</strong><span>30 seconds per question. Think quickly.</span></div></div>
          <div class="feature"><div class="feature-icon">⇄</div><div><strong>Pick your strategy</strong><span>Three routes with different rewards.</span></div></div>
        </div>
        <div class="instructions-note"><strong>How to play:</strong> Choose Algebra, Statistics, or Mixed at the start of each chamber. Answer all ten questions correctly to clear it. A wrong answer or timeout fails the current chamber, but your completed-chamber score and unused resources are kept. You can retry as often as needed.</div>`;
      const play = document.getElementById('play-btn'); if (play) play.addEventListener('click', () => { state.screen = 'route'; render(); });
      const cont = document.getElementById('continue-btn'); if (cont) cont.addEventListener('click', continueJourney);
      const fresh = document.getElementById('new-game-btn'); if (fresh) fresh.addEventListener('click', () => resetGame(true));
    }
    function renderChamberTrack() {
      return `<div class="chamber-track" aria-label="Chamber progression">${LEVELS.map((level, index) => {
        const done = index < state.completedLevels;
        const current = index === state.completedLevels;
        const status = done ? 'done' : current ? 'current' : 'locked';
        const mark = done ? '✓' : current ? String(index + 1) : '🔒';
        return `<div class="chamber-step ${status}"><div class="step-number">${mark}</div><b>${level.name}</b><small>${done ? 'Cleared' : current ? level.difficulty : 'Locked'}</small></div>`;
      }).join('')}</div>`;
    }
    function renderRoutes() {
      if (state.completedLevels >= 5) { state.screen = 'victory'; return renderVictory(); }
      const level = LEVELS[state.completedLevels];
      app.innerHTML = `<section class="panel screen-panel">
        <div class="section-head"><div><div class="eyebrow">Choose your next move</div><h2>Pick an Equation Door</h2><p>Each chamber has ten questions and one route. Your choice sets the subject and the reward. The route stays locked for the whole attempt, including a retry.</p></div><div class="level-badge">LEVEL ${state.completedLevels + 1} / 5 · ${level.difficulty}</div></div>
        ${renderChamberTrack()}
        <div class="muted" style="font-size:12px;margin:0 0 13px">${level.name} · ${level.algebra} · ${level.statistics}</div>
        <div class="door-grid">${Object.entries(ROUTES).map(([key, route]) => `<article class="door-card ${route.className}"><div class="door-symbol" aria-hidden="true">${route.icon}</div><h3>${route.name}</h3><p>${route.description}</p><div class="reward-line">✦ Completion reward: ${route.reward}</div><button class="btn ${key === 'statistics' ? 'gold' : key === 'mixed' ? 'secondary' : ''}" data-route="${key}">Choose ${route.short} <span aria-hidden="true">→</span></button></article>`).join('')}</div>
        <div class="instructions-note">A correct answer earns 1 point. Reach every fifth consecutive correct answer to earn a Lifeline when your inventory has room. Use a Lifeline to remove one wrong option or a Time Boost to add up to 10 seconds to a question (40 seconds maximum total).</div>
        ${state.lastCompletion ? `<p class="muted" style="font-size:12px;margin:17px 0 0">Last chamber cleared: ${LEVELS[state.lastCompletion.level].name}. ${state.lastCompletion.rewardText}</p>` : ''}
      </section>`;
      app.querySelectorAll('[data-route]').forEach(button => button.addEventListener('click', () => startLevel(button.dataset.route)));
    }
    function renderGame(startClock = true) {
      const question = state.questions[state.questionIndex];
      if (!question || !validQuestion(question)) {
        failLevel('invalid');
        return;
      }
      const level = LEVELS[state.currentLevel];
      const progress = ((state.questionIndex) / 10) * 100;
      const remainingStreak = 5 - (state.streak % 5 || 0);
      const toNextStreak = state.streak % 5 === 0 ? 5 : remainingStreak;
      app.innerHTML = `<section class="game-shell" aria-label="Equation Escape game">
        <div class="game-main">
          <div class="game-topline"><div class="level-label">CHAMBER ${state.currentLevel + 1} · ${level.name} <span style="color:#657293">/</span> QUESTION ${state.questionIndex + 1} OF 10</div><div class="route-chip">${ROUTES[state.selectedRoute].short} route</div></div>
          <section class="question-card" aria-labelledby="question-title">
            <div class="question-meta"><span>Challenge ${String(state.currentLevel * 10 + state.questionIndex + 1).padStart(2, '0')}</span><span class="topic-pill">${question.subject}</span></div>
            <h2 class="question-text" id="question-title">${escapeHtml(question.prompt)}</h2>
            <div class="answer-list" role="group" aria-label="Choose one answer">${question.choices.map((choice, index) => { const eliminated = state.eliminatedChoices.includes(choice); return `<button class="answer-btn${eliminated ? ' eliminated' : ''}" type="button" data-answer="${escapeAttr(choice)}" ${eliminated || state.questionLocked ? 'disabled' : ''} aria-label="Option ${String.fromCharCode(65 + index)}: ${escapeAttr(choice)}"><span style="color:var(--cyan);margin-right:11px;font-size:11px">${String.fromCharCode(65 + index)}</span>${escapeHtml(choice)}</button>`; }).join('')}</div>
            <div class="question-footer"><div class="feedback" id="feedback" role="status">${escapeHtml(state.feedback || 'Choose the correct answer to keep your escape moving.')}</div><div class="resource-actions">
              <button class="resource-btn" id="lifeline-btn" type="button" ${state.lifelines <= 0 || state.questionLocked || state.lifelineUsedThisQuestion ? 'disabled' : ''} title="Remove one incorrect answer">✂ Lifeline <span class="resource-count">${state.lifelines}</span></button>
              <button class="resource-btn" id="boost-btn" type="button" ${state.timeBoosts <= 0 || state.boostUsedThisQuestion || state.questionLocked ? 'disabled' : ''} title="Add 10 seconds, up to 40 seconds total">◷ Time Boost <span class="resource-count">${state.timeBoosts}</span></button>
            </div></div>
          </section>
          <div style="margin-top:14px"><div style="display:flex;justify-content:space-between;gap:12px;font-size:10px;color:var(--muted);font-weight:800;letter-spacing:.1em;text-transform:uppercase"><span>Chamber progress</span><span>${state.questionIndex}/10 solved</span></div><div class="progress-track"><div class="progress-fill" style="width:${progress}%"></div></div></div>
        </div>
        <aside class="sidebar" aria-label="Game status">
          <div class="stat-card timer-card"><div class="stat-label">Time remaining</div><div class="stat-value timer-value" id="timer-value">00:30</div><div class="timer-track" id="timer-track" role="progressbar" aria-label="Time remaining" aria-valuemin="0" aria-valuemax="40" aria-valuenow="30"><div class="timer-fill" id="timer-fill"></div></div><div class="stat-help">30 seconds base · max 40 with boost</div></div>
          <div class="stat-card"><div class="stat-label">Total score</div><div class="stat-value">${state.savedScore + state.currentScore}<span style="font-size:13px;color:var(--muted);font-weight:700"> / 50</span></div><div class="stat-help">${state.currentScore} current-chamber points · saved score ${state.savedScore}</div></div>
          <div class="stat-card"><div class="stat-label">Correct streak</div><div class="stat-value streak-mark">${state.streak} <span style="font-size:12px;color:var(--muted);font-weight:700">🔥</span></div><div class="stat-help">${toNextStreak} more correct ${toNextStreak === 1 ? 'answer' : 'answers'} to the next Lifeline reward</div></div>
          <div class="stat-card"><div class="stat-label">Resource inventory</div><div class="inventory-row"><span>✂ Lifelines</span><strong>${state.lifelines} / 2</strong></div><div class="inventory-row"><span>◷ Time Boosts</span><strong>${state.timeBoosts} / 2</strong></div><div class="stat-help">Resources survive failed attempts. Spent resources stay spent.</div></div>
          <div class="side-note">One wrong answer or a timeout fails this chamber. Solve all ten correctly to bank the chamber's 10 points and unlock your next route.</div>
        </aside>
      </section>`;
      app.querySelectorAll('[data-answer]').forEach(button => button.addEventListener('click', () => answerQuestion(button.dataset.answer)));
      const lifeline = document.getElementById('lifeline-btn'); if (lifeline) lifeline.addEventListener('click', useLifeline);
      const boost = document.getElementById('boost-btn'); if (boost) boost.addEventListener('click', useTimeBoost);
      if (startClock) startTimer();
    }
    function renderFail() {
      const failure = state.failure || { reason: 'wrong', level: state.currentLevel, route: state.selectedRoute, questionNumber: state.questionIndex + 1, attemptScore: state.currentScore };
      const reason = failure.reason === 'timeout' ? 'The timer reached zero before you locked in an answer.' : failure.reason === 'invalid' ? 'A question could not be validated safely. No points were banked for this attempt.' : 'That choice was not correct. The chamber has reset, but your journey is not over.';
      app.innerHTML = `<section class="panel failure-panel"><div class="result-symbol" aria-hidden="true">↻</div><div class="eyebrow" style="justify-content:center;color:var(--pink)">Chamber interrupted</div><h2 style="margin-top:12px">Level Failed</h2><p class="result-copy">${reason} You can retry this chamber without a limit. Its chosen route stays the same, while unused resources and points from previously cleared chambers are preserved.</p>
        <div class="result-grid"><div class="result-stat"><span>Failed chamber</span><strong>${failure.level + 1} · ${LEVELS[failure.level].name}</strong></div><div class="result-stat"><span>Chosen route</span><strong>${ROUTES[failure.route] ? ROUTES[failure.route].short : '—'}</strong></div><div class="result-stat"><span>Failure point</span><strong>Question ${failure.questionNumber}/10</strong></div><div class="result-stat"><span>Attempt points (not banked)</span><strong>${failure.attemptScore}</strong></div><div class="result-stat"><span>Saved score</span><strong>${state.savedScore} / 50</strong></div><div class="result-stat"><span>Resources kept</span><strong>✂ ${state.lifelines} · ◷ ${state.timeBoosts}</strong></div></div>
        <div class="center-actions"><button class="btn danger" id="restart-level-btn">Restart This Level <span aria-hidden="true">↻</span></button></div></section>`;
      document.getElementById('restart-level-btn').addEventListener('click', restartLevel);
    }
    function renderMixedReward() {
      const canLife = state.lifelines < MAX_RESOURCE;
      const canBoost = state.timeBoosts < MAX_RESOURCE;
      app.innerHTML = `<section class="panel clear-panel"><div class="result-symbol clear" aria-hidden="true">✦</div><div class="eyebrow" style="justify-content:center;color:var(--gold)">Mixed route cleared</div><h2 style="margin-top:12px">Choose your reward</h2><p class="result-copy">You completed Chamber ${state.pendingFinishedLevel + 1}. The 10 points are banked. Pick one reward to prepare for the next chamber.</p><div class="result-grid"><div class="result-stat"><span>Saved score</span><strong>${state.savedScore} / 50</strong></div><div class="result-stat"><span>Lifelines</span><strong>${state.lifelines} / 2</strong></div><div class="result-stat"><span>Time Boosts</span><strong>${state.timeBoosts} / 2</strong></div></div><div class="center-actions"><button class="btn" id="choose-life-btn" ${canLife ? '' : 'disabled'}>✂ Take a Lifeline</button><button class="btn gold" id="choose-boost-btn" ${canBoost ? '' : 'disabled'}>◷ Take a Time Boost</button></div><p class="muted" style="font-size:11px;margin-top:18px">${!canLife && !canBoost ? 'Both inventories are full. No additional reward is available.' : !canLife ? 'Your Lifeline inventory is full, so choose a Time Boost.' : !canBoost ? 'Your Time Boost inventory is full, so choose a Lifeline.' : 'Inventory limit: two of each resource.'}</p></section>`;
      const life = document.getElementById('choose-life-btn'); if (life) life.addEventListener('click', () => chooseMixedReward('lifeline'));
      const boost = document.getElementById('choose-boost-btn'); if (boost) boost.addEventListener('click', () => chooseMixedReward('boost'));
      if (!canLife && !canBoost) {
        const continueBtn = document.createElement('button'); continueBtn.className = 'btn secondary'; continueBtn.textContent = 'Continue';
        continueBtn.addEventListener('click', () => { state.lastCompletion = { level: state.pendingFinishedLevel, route: 'mixed', rewardText: 'No reward; both inventories were full.' }; state.pendingFinishedLevel = null; state.pendingRoute = null; state.screen = state.completedLevels >= 5 ? 'victory' : 'route'; saveCheckpoint(); render(); });
        app.querySelector('.center-actions').appendChild(continueBtn);
      }
    }
    function renderVictory() {
      stopTimer();
      app.innerHTML = `<section class="panel victory-panel"><div class="result-symbol win" aria-hidden="true">✓</div><div class="eyebrow" style="justify-content:center">All chambers conquered</div><h2 style="margin-top:12px">Equation Escape Completed!</h2><p class="result-copy">You escaped all five chambers by answering all 50 challenges correctly across successful runs. You showed accuracy, speed, and strategic resource management.</p><div class="result-grid"><div class="result-stat"><span>Final score</span><strong>${Math.min(MAX_SCORE, state.savedScore)} / 50</strong></div><div class="result-stat"><span>Chambers cleared</span><strong>5 / 5</strong></div><div class="result-stat"><span>Resources remaining</span><strong>✂ ${state.lifelines} · ◷ ${state.timeBoosts}</strong></div></div><div class="level-summary" aria-label="Completed chambers">${LEVELS.map((level, index) => `<div class="level-token" title="${level.name}" aria-label="${level.name} completed">✓</div>`).join('')}</div><div class="center-actions"><button class="btn" id="play-again-btn">Play Again <span aria-hidden="true">↻</span></button></div></section>`;
      document.getElementById('play-again-btn').addEventListener('click', () => resetGame(true));
    }
    function escapeHtml(value) {
      return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }
    function escapeAttr(value) { return escapeHtml(value).replace(/`/g, '&#96;'); }

    // Restore the latest safe checkpoint. An unfinished question is never resumed with a stale timer.
    loadCheckpoint();
    render();
  })();
  </script>
</body>
</html>
